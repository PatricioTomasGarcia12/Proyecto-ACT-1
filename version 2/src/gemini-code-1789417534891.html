<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Información de Contacto</title>
  <link rel="stylesheet" href="estilosIA.css">
</head>
<body>

  <header role="banner">
    <h1>Anuncio de Mascotas Perdidas</h1>
    <nav aria-label="Navegación principal">
      <ul>
        <li><a href="index.html">Listado de Mascotas</a></li>
        <li><a href="contacto.html" aria-current="page">Información de Contacto</a></li>
        <li><a href="info_sitio.html">Información del Sitio</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <h2>Formulario de Contacto</h2>
    <p style="text-align: center; margin-bottom: 2rem;">Complete sus datos si ha encontrado una mascota o desea publicar una pérdida.</p>

    <form action="#" method="post" aria-labelledby="form-heading">
      <div class="form-group">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" required aria-required="true" autocomplete="name">
      </div>

      <div class="form-group">
        <label for="telefono">Número de Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required aria-required="true" autocomplete="tel">
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" required aria-required="true" autocomplete="email">
      </div>

      <button type="submit" class="btn-submit">Enviar Información</button>
    </form>
  </main>

  <footer role="contentinfo">
    <p>&copy; 2026 - Sitio de Anuncio de Mascotas Perdidas</p>
  </footer>

</body>
</html>
